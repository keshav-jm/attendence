<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 15% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 40%);
        }

        .navbar {
            background: rgba(8, 12, 20, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            height: 72px;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand span { color: var(--primary); }

        .nav-links { display: flex; gap: 0.5rem; }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            padding: 0.6rem 1.25rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link.active {
            color: var(--text-main);
            border: 1px solid rgba(59, 130, 246, 0.3);
            background: rgba(59, 130, 246, 0.12);
        }

        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3.5rem 3rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2rem;
        }

        .role-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 2rem;
        }

        .role-btn {
            flex: 1;
            padding: 0.7rem;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .role-btn.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .form-group { margin-bottom: 1.5rem; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: #cbd5e1;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-input.invalid {
            border-color: var(--danger);
            background: rgba(248, 113, 113, 0.05);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
            display: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-weight: 700;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 8px 20px -4px var(--primary-glow);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(59, 130, 246, 0.5);
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
            </div>
            Academic<span>Portal</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <a href="login.html" class="nav-link active">Login</a>
        </div>
    </nav>

    <main class="login-section">
        <div class="login-card">
            <h1 class="login-title">Account Login</h1>
            <p class="login-subtitle">Choose your access level</p>
            
            <div class="role-switcher">
                <button type="button" class="role-btn active" id="studentRoleBtn" onclick="selectRole('student')">Student</button>
                <button type="button" class="role-btn" id="teacherRoleBtn" onclick="selectRole('teacher')">Faculty</button>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" id="idLabel">Student ID</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g., ST10294" required>
                    <div class="error-msg" id="usernameError">Invalid ID format.</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <div class="error-msg" id="passwordError">Password must be at least 6 characters.</div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Login as Student</button>
            </form>
        </div>
    </main>

    <script>
        let currentRole = 'student';

        function selectRole(role) {
            currentRole = role;
            const studentBtn = document.getElementById('studentRoleBtn');
            const teacherBtn = document.getElementById('teacherRoleBtn');
            const idLabel = document.getElementById('idLabel');
            const usernameInput = document.getElementById('username');
            const submitBtn = document.getElementById('submitBtn');

            clearErrors();

            if (role === 'student') {
                studentBtn.classList.add('active');
                teacherBtn.classList.remove('active');
                idLabel.innerText = 'Student ID';
                usernameInput.placeholder = 'e.g., ST10294';
                submitBtn.innerText = 'Login as Student';
            } else {
                teacherBtn.classList.add('active');
                studentBtn.classList.remove('active');
                idLabel.innerText = 'Faculty ID';
                usernameInput.placeholder = 'e.g., FAC2049';
                submitBtn.innerText = 'Login as Faculty';
            }
        }

        function clearErrors() {
            document.querySelectorAll('.form-input').forEach(i => i.classList.remove('invalid'));
            document.querySelectorAll('.error-msg').forEach(m => m.style.display = 'none');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');

            let isValid = true;

            if (currentRole === 'student') {
                const studentPattern = /^ST\d{5}$/i;
                if (!studentPattern.test(username)) {
                    usernameError.innerText = 'ID must start with "ST" + 5 digits (e.g. ST10294).';
                    usernameError.style.display = 'block';
                    usernameInput.classList.add('invalid');
                    isValid = false;
                }
            } else {
                const facultyPattern = /^FAC\d{4}$/i;
                if (!facultyPattern.test(username)) {
                    usernameError.innerText = 'ID must start with "FAC" + 4 digits (e.g. FAC2049).';
                    usernameError.style.display = 'block';
                    usernameInput.classList.add('invalid');
                    isValid = false;
                }
            }

            if (password.length < 6) {
                passwordError.innerText = 'Password must be at least 6 characters.';
                passwordError.style.display = 'block';
                passwordInput.classList.add('invalid');
                isValid = false;
            }

            if (isValid) {
                localStorage.setItem('userRole', currentRole);
                localStorage.setItem('userId', username.toUpperCase());
                localStorage.setItem('isLoggedIn', 'true');

                if (currentRole === 'student') {
                    window.location.href = 'student-dashboard.html';
                } else {
                    window.location.href = 'faculty-dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
